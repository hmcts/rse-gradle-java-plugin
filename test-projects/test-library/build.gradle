plugins {
    id 'java-library'
    id 'uk.gov.hmcts.java'
}

repositories {
    mavenLocal()
    mavenCentral()
}

checkstyle {
    toolVersion '10.26.1'
}

dependencies {

    implementation 'io.swagger:swagger-annotations:1.6.16'

    // Use JUnit test framework
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    functionalTest {
    }
}

dependencyCheck {
    suppressionFile = file('suppressions.xml').absolutePath
}


tasks.register("assertRepositoriesOrdered") {
    doLast {
        def repositoryNames = project.repositories.collect { it.name }

        assert repositoryNames == [
                "MavenLocal",
                "MavenRepo"
        ]
    }
}
